name: Go-tests
on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.25.1'
      - name: Install dependencies
        run: go mod download
      - name: Test with the Go CLI
        run: |
          cd test
          go test
